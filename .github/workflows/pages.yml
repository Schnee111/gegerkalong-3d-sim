name: pages

on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore: *docs-only
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PROJECT_NAME: gerlong

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          CF_PAGES: '1'
        run: npm run build

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 1

  preview:
    name: Preview deploy (PR)
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Publish preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$PROJECT_NAME" \
            --branch="pr-${{ github.event.pull_request.number }}" \
            --commit-hash="${{ github.event.pull_request.head.sha }}" \
            --commit-dirty=true

      - name: Verify preview
        env:
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.${{ env.PROJECT_NAME }}.pages.dev
        run: |
          curl -fsS -o /dev/null --retry 5 --retry-delay 10 "$PREVIEW_URL/"
          asset_path=$(curl -fsS "$PREVIEW_URL/" | grep -oE '/assets/[^" ]+\.js' | head -1)
          test -n "$asset_path"
          curl -fsS -o /dev/null "$PREVIEW_URL$asset_path"

      - name: Comment preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.${{ env.PROJECT_NAME }}.pages.dev/
        with:
          script: |
            const marker = '<!-- pages-preview -->';
            const url = process.env.PREVIEW_URL;
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => (c.body || '').includes(marker));
            const body = `${marker}\n**Preview:** ${url}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body,
              });
            }

  deploy:
    name: Deploy production
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.site.outputs.url }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project list | grep -qw "$PROJECT_NAME" ||
            npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch=main

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=true

      - name: Resolve site URL
        id: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          subdomain=$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME" \
            | jq -r '.result.subdomain')
          echo "url=https://$subdomain" >> "$GITHUB_OUTPUT"

      - name: Smoke check deployed site
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
        run: |
          curl -fsS -o /dev/null --retry 5 --retry-delay 10 "$SITE_URL/"
          asset_path=$(curl -fsS "$SITE_URL/" | grep -oE '/assets/[^" ]+\.js' | head -1)
          test -n "$asset_path"
          curl -fsS -o /dev/null "$SITE_URL$asset_path"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/assets/missing-asset.js")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/assets/index-BVNRPY4u.js.map")" = 404
